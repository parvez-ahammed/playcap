[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "playcap"
version = "0.2.0"
description = "Open-source browser DVR: a queue of pages with video in, a verified, compressed media library out."
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "requests",
    "websocket-client",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Video :: Capture",
]

[project.urls]
Homepage = "https://github.com/parvez-ahammed/playcap"
Issues = "https://github.com/parvez-ahammed/playcap/issues"

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
playcap = "playcap.__main__:main"
playcap-browser = "playcap.browser:main"
playcap-queue = "playcap.build_queue:main"
playcap-record = "playcap.recorder:main"
playcap-optimize = "playcap.optimize:main"
playcap-organize = "playcap.organize:main"
playcap-status = "playcap.status:main"
playcap-control = "playcap.control:main"

[tool.setuptools.packages.find]
include = ["playcap*"]

[tool.setuptools.package-data]
"playcap.ui" = ["*.html", "*.js", "*.css"]
"playcap.demo" = ["*.html", "*.mp4", "*.txt"]
