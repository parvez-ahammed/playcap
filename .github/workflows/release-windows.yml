name: release-windows

# Builds the portable Windows zip (embedded Python, no install needed) and
# attaches it, with its .sha256, to the GitHub release that triggered the run.
# A manual run (workflow_dispatch) builds and smoke-tests the zip and keeps it
# as a workflow artifact only; it never touches a release.
# See packaging/README.md for the distribution plan.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable-zip:
    runs-on: windows-latest
    permissions:
      contents: write          # gh release upload
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      # Same minor version as the embedded Python in build_portable.py, so the
      # tests run on the interpreter users actually get.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Tests
        run: |
          pip install -e ".[test]"
          python -m pytest tests -q

      - name: Release tag matches playcap.__version__
        if: github.event_name == 'release'
        run: |
          v=$(python -c "import playcap; print(playcap.__version__)")
          tag="${{ github.event.release.tag_name }}"
          if [ "${tag#v}" != "$v" ]; then
            echo "::error::release tag $tag does not match playcap.__version__ $v"
            exit 1
          fi

      - uses: actions/cache@v4
        with:
          path: build/portable-cache
          key: portable-cache-${{ hashFiles('packaging/windows/build_portable.py') }}

      - name: Build portable zip
        run: python packaging/windows/build_portable.py

      - name: Smoke-test the zip (extract, imports, launcher serves the UI)
        run: python packaging/windows/smoke_portable.py dist/playcap-*-windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: playcap-windows-x64
          path: |
            dist/playcap-*-windows-x64.zip
            dist/playcap-*-windows-x64.zip.sha256

      - name: Attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release upload "${{ github.event.release.tag_name }}"
          dist/playcap-*-windows-x64.zip dist/playcap-*-windows-x64.zip.sha256
          --clobber
